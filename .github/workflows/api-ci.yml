name: API CI

on:
  pull_request:
    paths:
      - "api/**"
      - "src/main/java/br/sistema/repository/ConnectionFactory.java"
      - ".github/workflows/api-ci.yml"
  push:
    branches:
      - master
    paths:
      - "api/**"
      - "src/main/java/br/sistema/repository/ConnectionFactory.java"
      - ".github/workflows/api-ci.yml"

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  legacy-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: pom.xml

      - name: Compile Swing application
        run: mvn --batch-mode --no-transfer-progress -DskipTests compile

  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tia_karol
          POSTGRES_USER: tia_karol
          POSTGRES_PASSWORD: tia_karol_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tia_karol -d tia_karol"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/tia_karol
      DATABASE_USERNAME: tia_karol
      DATABASE_PASSWORD: tia_karol_ci
      BOOTSTRAP_ADMIN_EMAIL: admin-ci@tiakarol.local
      BOOTSTRAP_ADMIN_PASSWORD: CI-Only-Strong-Password-123!
      BOOTSTRAP_ADMIN_NAME: CI Administrator
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: api/pom.xml

      - name: Verify API
        run: ./mvnw --batch-mode --no-transfer-progress -Pintegration-tests clean verify

      - name: Build production image
        run: docker build --tag tia-karol-api:${{ github.sha }} .

      - name: Smoke test production image
        shell: bash
        run: |
          docker run --detach --name tia-karol-api-ci --network host \
            --env SPRING_PROFILES_ACTIVE=dev \
            --env DATABASE_URL=jdbc:postgresql://localhost:5432/tia_karol \
            --env DATABASE_USERNAME=tia_karol \
            --env DATABASE_PASSWORD=tia_karol_ci \
            --env CORS_ALLOWED_ORIGINS=http://localhost:3000 \
            tia-karol-api:${{ github.sha }}
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:8080/actuator/health/readiness; then
              docker rm --force tia-karol-api-ci
              exit 0
            fi
            sleep 2
          done
          docker logs tia-karol-api-ci
          docker rm --force tia-karol-api-ci
          exit 1

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            api/target/surefire-reports
            api/target/failsafe-reports
          if-no-files-found: ignore
