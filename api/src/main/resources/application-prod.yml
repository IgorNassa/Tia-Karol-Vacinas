spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:10}
      minimum-idle: ${DATABASE_MIN_IDLE:1}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DATABASE_VALIDATION_TIMEOUT_MS:5000}
      max-lifetime: ${DATABASE_MAX_LIFETIME_MS:1800000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  rate-limit:
    auth-requests-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:20}
  openapi:
    public: false

springdoc:
  api-docs:
    enabled: ${OPENAPI_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${OPENAPI_UI_ENABLED:false}

logging:
  level:
    root: INFO
    br.com.tiakarol.api: INFO
    org.hibernate.SQL: WARN
