spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  config:
    import: optional:file:.env[.properties]
  application:
    name: tia-karol-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tia_karol}
    username: ${DATABASE_USERNAME:tia_karol}
    password: ${DATABASE_PASSWORD:tia_karol}
    hikari:
      maximum-pool-size: ${DATABASE_MAX_POOL_SIZE:10}
      minimum-idle: ${DATABASE_MIN_IDLE:1}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT_MS:30000}
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: app
    schemas: app
    create-schemas: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: app
    open-in-view: false
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  compression:
    enabled: true
  max-http-request-header-size: ${MAX_HTTP_REQUEST_HEADER_SIZE:16KB}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  tomcat:
    max-http-form-post-size: ${MAX_HTTP_FORM_POST_SIZE:2MB}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} level=%-5level requestId=%X{requestId:-none} logger=%logger{36} message=\"%replace(%msg){'\"',''}\"%n"
  level:
    root: INFO
    br.com.tiakarol.api: INFO
    org.hibernate.SQL: WARN

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  rate-limit:
    auth-requests-per-minute: ${AUTH_RATE_LIMIT_PER_MINUTE:20}
  openapi:
    public: ${OPENAPI_PUBLIC:true}

supabase:
  url: ${SUPABASE_URL:}
  publishable-key: ${SUPABASE_PUBLISHABLE_KEY:}

bootstrap:
  admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
    name: ${BOOTSTRAP_ADMIN_NAME:Administrador}

auth:
  access-token-minutes: ${AUTH_ACCESS_TOKEN_MINUTES:15}
  refresh-token-days: ${AUTH_REFRESH_TOKEN_DAYS:7}
