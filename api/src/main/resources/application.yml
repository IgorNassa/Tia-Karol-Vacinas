spring:
  application:
    name: tia-karol-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tia_karol}
    username: ${DATABASE_USERNAME:tia_karol}
    password: ${DATABASE_PASSWORD:tia_karol}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
