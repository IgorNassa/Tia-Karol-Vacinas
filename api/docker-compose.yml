services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tia_karol
      POSTGRES_USER: tia_karol
      POSTGRES_PASSWORD: tia_karol
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tia_karol -d tia_karol"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
