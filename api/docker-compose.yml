services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tia_karol
      POSTGRES_USER: tia_karol
      POSTGRES_PASSWORD: tia_karol
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tia_karol -d tia_karol"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build:
      context: .
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://postgres:5432/tia_karol
      DATABASE_USERNAME: tia_karol
      DATABASE_PASSWORD: tia_karol
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      BOOTSTRAP_ADMIN_EMAIL: admin@tiakarol.local
      BOOTSTRAP_ADMIN_PASSWORD: ChangeMe-LocalOnly-123!
    ports:
      - "8080:8080"

volumes:
  postgres_data:
